name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_TYPE: RelWithDebInfo
  CC: gcc
  CXX: g++

jobs:
  build-and-test:
    name: Build and Test (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      matrix:
        ubuntu: ["22.04", "24.04"]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ccache \
            libgtkmm-4.0-dev libvte-2.91-gtk4-dev \
            libadwaita-1-dev libgtksourceview-5-dev \
            libsqlite3-dev libmd4c-dev xvfb

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DREMIN_BUILD_GUI=ON \
            -DREMIN_BUILD_CLI=ON \
            -DREMIN_BUILD_TESTS=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (with xvfb for GUI tests)
        run: |
          cd build
          xvfb-run -a ctest --output-on-failure --parallel $(nproc)

      - name: Run clang-tidy
        if: always()
        run: |
          run-clang-tidy -p build -j$(nproc) -quiet -header-filter=src/

      - name: Static analysis with cppcheck
        run: |
          cppcheck --enable=all --std=c++20 --suppress=missingIncludeSystem \
            --inline-suppr --quiet src/ 2>&1 | head -50

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find src -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t remin:latest .
      - name: Test Docker image
        run: |
          docker run --rm remin:latest --help

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false