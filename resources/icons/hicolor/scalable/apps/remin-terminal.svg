<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Cùng dải màu gradient như logo: Tím đậm → Xanh Cyan -->
    <linearGradient id="termGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Khung terminal bo góc, phong cách giống logo -->
  <rect x="24" y="20" width="80" height="88" rx="12" fill="url(#termGrad)" fill-opacity="0.10" />
  <rect x="24" y="20" width="80" height="88" rx="12" stroke="url(#termGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Headbar: dấu nhắc lệnh >_ -->
  <g stroke="url(#termGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 58 L52 70 L36 82" />
    <path d="M60 82H84" stroke-width="8" />
  </g>
</svg>
