<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Cùng dải màu gradient như logo: Tím đậm → Xanh Cyan -->
    <linearGradient id="noteGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Giấy ghi chú bo góc, phong cách giống logo -->
  <rect x="24" y="20" width="80" height="88" rx="12" fill="url(#noteGrad)" fill-opacity="0.10" />
  <rect x="24" y="20" width="80" height="88" rx="12" stroke="url(#noteGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Các dòng văn bản của note -->
  <g stroke="url(#noteGrad)" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="46" x2="90" y2="46" stroke-opacity="0.95" />
    <line x1="38" y1="62" x2="74" y2="62" stroke-opacity="0.7" />
    <line x1="38" y1="78" x2="84" y2="78" stroke-opacity="0.55" />
    <line x1="38" y1="94" x2="66" y2="94" stroke-opacity="0.4" />
  </g>
</svg>
